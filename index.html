<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">

</head>

<body>
<main id="playing-cards">
  <div class="card">
    <div class="left">
      <span class ="red">A</span>
      <span class ="red">♥</span>
    </div>
    
    <div class="middle">
      <span class ="red">♥</span>
    </div>
    <div class="right">
      <span class ="red">♥</span>
      <span class ="red">A</span>
      </div>
  </div>
  <div class="card">
    <div class="left">
      <span>2</span>
      <span>♠</span>
    </div>
    <div class="middle">
      <span>♠</span>
      <span class="rotate">♠</span>
    </div>
    <div class="right">
      <span>♠</span>
      <span>2</span>
    </div>
  </div>
  <div class="card">
    <div class="left">
      <span class ="red">3</span>
      <span class ="red">♦</span>
    </div>
    <div class="middle">
      <span class ="red">♦</span>
      <span class ="red">♦</span>
      <span class ="red">♦</span>
    </div>
    <div class="right">
      <span class ="red">♦</span>
      <span class ="red">3</span>
    </div>
  </div>
  <div class="card">
    <div class="left">
      <span>4</span>
      <span>♣</span>
    </div>
    <div class="middle">
      <span>♣♣</span>
      <span class="rotate">♣♣</span>
      
    </div>
    <div class="right">
      <span>♣</span>
      <span>4</span>
    </div>
  </div>
  <div class="card">
    <div class="left">
      <span class ="red">5</span>
      <span class ="red">♥</span>
    </div>
    <div class="middle">
      <span class ="red">♥♥</span>
      <span class ="red">♥</span>
      <span class ="red rotate">♥♥</span>
    </div>
    <div class="right">
      <span class ="red">♥</span>
      <span class ="red">5</span>
    </div>
  </div>
</main>
</body>

</html>
